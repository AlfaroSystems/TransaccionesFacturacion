[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
opcache.revalidate_freq=0
; 1 = detecta cambios en los archivos PHP y vistas sin reiniciar (desarrollo)
; 0 = no los revisa, más rápido; requiere reiniciar el contenedor al desplegar (producción)
opcache.validate_timestamps=${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-1}
opcache.fast_shutdown=1
opcache.jit=tracing
opcache.jit_buffer_size=128M