services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: transacciones-facturacion-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-transacciones_facturacion}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      # OPcache: 1 en desarrollo (ve cambios sin reiniciar), 0 en producción (ver docker/php/opcache.ini)
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-1}
    depends_on:
      - db
    networks:
      - transacciones_network

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8005}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - transacciones_network

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      # Solo accesible desde este equipo (clientes como DBeaver o pgAdmin), no desde la red
      - "127.0.0.1:${FORWARD_DB_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-transacciones_facturacion}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    volumes:
      - transacciones_pgsql_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - transacciones_network

networks:
  transacciones_network:
    driver: bridge

volumes:
  transacciones_pgsql_data:
    driver: local